services:
  witcher-map:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    # Settings live in ./data/state.sqlite on the host.
    # Keep this mount. Rebuilding the image does not touch it.
    # Deleting ./data deletes the saved map config.
    environment:
      SAVE_INTERVAL_IN_SECONDS: ${SAVE_INTERVAL_IN_SECONDS:-30}
      DATA_DIR: /data
      PORT: 8080
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
